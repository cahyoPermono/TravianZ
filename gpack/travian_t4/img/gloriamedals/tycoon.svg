<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 155" width="120" height="155">
    <defs>
        <!-- Drop Shadow Filters -->
        <filter id="m_tyc_shadow" x="-20%" y="-15%" width="140%" height="140%">
            <feDropShadow dx="0" dy="4" stdDeviation="3.5" flood-color="#000000" flood-opacity="0.55"/>
        </filter>
        <filter id="m_tyc_emboss" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="0" dy="1.5" stdDeviation="1" flood-color="#FFFFFF" flood-opacity="0.75" result="light"/>
            <feDropShadow dx="0" dy="-1.5" stdDeviation="1" flood-color="#000000" flood-opacity="0.65" result="dark"/>
        </filter>
        <filter id="m_tyc_glow" x="-30%" y="-30%" width="160%" height="160%">
            <feGaussianBlur stdDeviation="3" result="blur"/>
            <feComposite in="SourceGraphic" in2="blur" operator="over"/>
        </filter>

        <!-- Ribbon Gradients -->
        <linearGradient id="m_tyc_rib_l" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#FF8F00"/>
            <stop offset="30%" stop-color="#FFA000"/>
            <stop offset="70%" stop-color="#C46D00"/>
            <stop offset="100%" stop-color="#FF8F00"/>
        </linearGradient>
        <linearGradient id="m_tyc_rib_stripe" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#FFEB3B"/>
            <stop offset="50%" stop-color="#FFF9C4"/>
            <stop offset="100%" stop-color="#FFEB3B"/>
        </linearGradient>
        <linearGradient id="m_tyc_rib_v" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.25"/>
            <stop offset="20%" stop-color="#FFFFFF" stop-opacity="0.0"/>
            <stop offset="80%" stop-color="#000000" stop-opacity="0.0"/>
            <stop offset="100%" stop-color="#000000" stop-opacity="0.45"/>
        </linearGradient>

        <!-- Clasp / Bar Gradients -->
        <linearGradient id="m_tyc_clasp" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#FFD700"/>
            <stop offset="25%" stop-color="#FFFFFF"/>
            <stop offset="50%" stop-color="#FFD700"/>
            <stop offset="100%" stop-color="#8A6000"/>
        </linearGradient>
        <linearGradient id="m_tyc_ring" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#FFD700"/>
            <stop offset="40%" stop-color="#FFFFFF"/>
            <stop offset="70%" stop-color="#473000"/>
            <stop offset="100%" stop-color="#FFD700"/>
        </linearGradient>

        <!-- Medallion Rim Gradients -->
        <linearGradient id="m_tyc_rim" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#FFF5B8"/>
            <stop offset="25%" stop-color="#FFE066"/>
            <stop offset="50%" stop-color="#473000"/>
            <stop offset="75%" stop-color="#D4A017"/>
            <stop offset="100%" stop-color="#7A5200"/>
        </linearGradient>
        <linearGradient id="m_tyc_rim_inner" x1="100%" y1="100%" x2="0%" y2="0%">
            <stop offset="0%" stop-color="#FFF5B8"/>
            <stop offset="50%" stop-color="#D4A017"/>
            <stop offset="100%" stop-color="#473000"/>
        </linearGradient>

        <!-- Medallion Face Radial Gradient -->
        <radialGradient id="m_tyc_face" cx="45%" cy="40%" r="65%">
            <stop offset="0%" stop-color="#E8B923"/>
            <stop offset="70%" stop-color="#5C3E00"/>
            <stop offset="100%" stop-color="#0A0604"/>
        </radialGradient>

        <!-- Gold Relief Gradient for Emblems -->
        <linearGradient id="m_tyc_gold_relief" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#FFF8D6"/>
            <stop offset="35%" stop-color="#FFDF66"/>
            <stop offset="70%" stop-color="#C2870A"/>
            <stop offset="100%" stop-color="#734F00"/>
        </linearGradient>

        <!-- Silver Relief Gradient -->
        <linearGradient id="m_tyc_silver_relief" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#FFFFFF"/>
            <stop offset="35%" stop-color="#E1E8F0"/>
            <stop offset="70%" stop-color="#8E9AA6"/>
            <stop offset="100%" stop-color="#4B5560"/>
        </linearGradient>
    </defs>    <!-- Hanging Ribbon -->
    <g filter="url(#m_tyc_shadow)">
        <polygon points="35,8 85,8 85,55 60,68 35,55" fill="url(#m_tyc_rib_l)"/>
        <polygon points="50,8 70,8 70,62 60,68 50,62" fill="url(#m_tyc_rib_stripe)"/>
        <polygon points="35,8 85,8 85,55 60,68 35,55" fill="url(#m_tyc_rib_v)"/>
        <line x1="37" y1="8" x2="37" y2="56" stroke="#FFD700" stroke-width="1.5" opacity="0.75"/>
        <line x1="83" y1="8" x2="83" y2="56" stroke="#FFD700" stroke-width="1.5" opacity="0.75"/>
    </g>

    <!-- Top Hanger Bar / Clasp -->
    <g filter="url(#m_tyc_shadow)">
        <rect x="28" y="5" width="64" height="8" rx="2.5" fill="url(#m_tyc_clasp)" stroke="#3D2505" stroke-width="0.8"/>
        <circle cx="32" cy="9" r="1.5" fill="#FFF" opacity="0.8"/>
        <circle cx="88" cy="9" r="1.5" fill="#FFF" opacity="0.8"/>
    </g>

    <!-- Connecting Suspension Ring -->
    <circle cx="60" cy="65" r="8" fill="none" stroke="url(#m_tyc_ring)" stroke-width="3" filter="url(#m_tyc_shadow)"/>

    <!-- Circular Medallion Body -->
    <g filter="url(#m_tyc_shadow)">
        <circle cx="60" cy="102" r="43" fill="url(#m_tyc_rim)" stroke="#1F1206" stroke-width="1"/>
        <circle cx="60" cy="102" r="39.5" fill="none" stroke="url(#m_tyc_rim_inner)" stroke-width="1.5" stroke-dasharray="1.8,1.8"/>
        <circle cx="60" cy="102" r="37" fill="url(#m_tyc_rim_inner)" stroke="#261608" stroke-width="0.8"/>
        <circle cx="60" cy="102" r="34" fill="url(#m_tyc_face)"/>
        <g opacity="0.18" stroke="#FFFFFF" stroke-width="0.7">
            <line x1="72" y1="102" x2="93" y2="102"/>
            <line x1="71.1" y1="106.6" x2="90.5" y2="114.6"/>
            <line x1="68.5" y1="110.5" x2="83.3" y2="125.3"/>
            <line x1="64.6" y1="113.1" x2="72.6" y2="132.5"/>
            <line x1="60" y1="114" x2="60" y2="135"/>
            <line x1="55.4" y1="113.1" x2="47.4" y2="132.5"/>
            <line x1="51.5" y1="110.5" x2="36.7" y2="125.3"/>
            <line x1="48.9" y1="106.6" x2="29.5" y2="114.6"/>
            <line x1="48" y1="102" x2="27" y2="102"/>
            <line x1="48.9" y1="97.4" x2="29.5" y2="89.4"/>
            <line x1="51.5" y1="93.5" x2="36.7" y2="78.7"/>
            <line x1="55.4" y1="90.9" x2="47.4" y2="71.5"/>
            <line x1="60" y1="90" x2="60" y2="69"/>
            <line x1="64.6" y1="90.9" x2="72.6" y2="71.5"/>
            <line x1="68.5" y1="93.5" x2="83.3" y2="78.7"/>
            <line x1="71.1" y1="97.4" x2="90.5" y2="89.4"/>
        </g>
        <!-- Laurel Wreath Inner Border -->
        <g opacity="0.4" fill="url(#m_tyc_gold_relief)">
            <ellipse cx="34" cy="87" rx="2.5" ry="4.5" transform="rotate(-60 34 87)"/>
            <ellipse cx="86" cy="87" rx="2.5" ry="4.5" transform="rotate(60 86 87)"/>
            <ellipse cx="42.4" cy="77.7" rx="2.5" ry="4.5" transform="rotate(-36 42.4 77.7)"/>
            <ellipse cx="77.6" cy="77.7" rx="2.5" ry="4.5" transform="rotate(36 77.6 77.7)"/>
            <ellipse cx="53.8" cy="72.7" rx="2.5" ry="4.5" transform="rotate(-12 53.8 72.7)"/>
            <ellipse cx="66.2" cy="72.7" rx="2.5" ry="4.5" transform="rotate(12 66.2 72.7)"/>
            <ellipse cx="66.2" cy="72.7" rx="2.5" ry="4.5" transform="rotate(12 66.2 72.7)"/>
            <ellipse cx="53.8" cy="72.7" rx="2.5" ry="4.5" transform="rotate(-12 53.8 72.7)"/>
            <ellipse cx="77.6" cy="77.7" rx="2.5" ry="4.5" transform="rotate(36 77.6 77.7)"/>
            <ellipse cx="42.4" cy="77.7" rx="2.5" ry="4.5" transform="rotate(-36 42.4 77.7)"/>
            <ellipse cx="86" cy="87" rx="2.5" ry="4.5" transform="rotate(60 86 87)"/>
            <ellipse cx="34" cy="87" rx="2.5" ry="4.5" transform="rotate(-60 34 87)"/>
        </g>
    </g>

    <!-- Emblem: Economy Tycoon (Treasure Chest Overflowing with Gold) -->
    <g filter="url(#m_tyc_emboss)">
        <!-- Twin Wheat Sheaves / Laurel -->
        <g fill="#FFA000" stroke="#5D4037" stroke-width="0.5">
            <ellipse cx="43" cy="95" rx="3" ry="6" transform="rotate(-30 43 95)"/>
            <ellipse cx="40" cy="103" rx="3" ry="6" transform="rotate(-45 40 103)"/>
            <ellipse cx="77" cy="95" rx="3" ry="6" transform="rotate(30 77 95)"/>
            <ellipse cx="80" cy="103" rx="3" ry="6" transform="rotate(45 80 103)"/>
        </g>
        <!-- Wooden Iron-Strapped Chest Base -->
        <rect x="44" y="96" width="32" height="16" rx="2" fill="#5D4037" stroke="#271202" stroke-width="1"/>
        <!-- Gold Coin Mounds overflowing top -->
        <ellipse cx="60" cy="93" rx="14" ry="7" fill="#FFD700" stroke="#B28900" stroke-width="0.8"/>
        <circle cx="56" cy="91" r="2.8" fill="#FFF176" stroke="#B28900" stroke-width="0.6"/>
        <circle cx="62" cy="89" r="2.8" fill="#FFD700" stroke="#B28900" stroke-width="0.6"/>
        <circle cx="65" cy="93" r="2.8" fill="#FFF176" stroke="#B28900" stroke-width="0.6"/>
        <circle cx="53" cy="94" r="2.8" fill="#FFD700" stroke="#B28900" stroke-width="0.6"/>
        <!-- Chest Open Lid angled back -->
        <path d="M 43,92 Q 60,82 77,92 L 75,87 Q 60,78 45,87 Z" fill="#795548" stroke="#271202" stroke-width="1"/>
        <!-- Golden Straps & Keyhole Plaque -->
        <rect x="49" y="96" width="3" height="16" fill="url(#m_tyc_gold_relief)"/>
        <rect x="68" y="96" width="3" height="16" fill="url(#m_tyc_gold_relief)"/>
        <circle cx="60" cy="103" r="3" fill="url(#m_tyc_gold_relief)"/>
        <polygon points="60,102 59,105 61,105" fill="#1C0D02"/>
    </g>    <!-- Tier Stars -->
    <g filter="url(#m_tyc_shadow)" fill="url(#m_tyc_gold_relief)" stroke="#4A2E00" stroke-width="0.5">
        <path d="M 49,135 m 0,-5.5 1.6,3.6 3.9,0.4 -2.9,2.6 0.8,3.9 -3.4,-2 -3.4,2 0.8,-3.9 -2.9,-2.6 3.9,-0.4 z"/>
        <path d="M 60,135 m 0,-5.5 1.6,3.6 3.9,0.4 -2.9,2.6 0.8,3.9 -3.4,-2 -3.4,2 0.8,-3.9 -2.9,-2.6 3.9,-0.4 z"/>
        <path d="M 71,135 m 0,-5.5 1.6,3.6 3.9,0.4 -2.9,2.6 0.8,3.9 -3.4,-2 -3.4,2 0.8,-3.9 -2.9,-2.6 3.9,-0.4 z"/>
    </g>
    <!-- Bottom Ribbon Title Scroll -->
    <g filter="url(#m_tyc_shadow)">
        <path d="M 26,140 Q 60,135 94,140 L 98,148 Q 60,143 22,148 Z" fill="#241407" stroke="#C9A020" stroke-width="0.8"/>
        <text x="60" y="145.5" font-family="'Georgia', 'Times New Roman', serif" font-size="6.5" font-weight="bold" fill="#FFE680" text-anchor="middle" letter-spacing="0.8">TYCOON</text>
    </g></svg>
