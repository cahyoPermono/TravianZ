<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 155" width="120" height="155">
    <defs>
        <!-- Drop Shadow Filters -->
        <filter id="m_om_shadow" x="-20%" y="-15%" width="140%" height="140%">
            <feDropShadow dx="0" dy="4" stdDeviation="3.5" flood-color="#000000" flood-opacity="0.55"/>
        </filter>
        <filter id="m_om_emboss" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="0" dy="1.5" stdDeviation="1" flood-color="#FFFFFF" flood-opacity="0.75" result="light"/>
            <feDropShadow dx="0" dy="-1.5" stdDeviation="1" flood-color="#000000" flood-opacity="0.65" result="dark"/>
        </filter>
        <filter id="m_om_glow" x="-30%" y="-30%" width="160%" height="160%">
            <feGaussianBlur stdDeviation="3" result="blur"/>
            <feComposite in="SourceGraphic" in2="blur" operator="over"/>
        </filter>

        <!-- Ribbon Gradients -->
        <linearGradient id="m_om_rib_l" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#0E3D24"/>
            <stop offset="30%" stop-color="#1E6B3F"/>
            <stop offset="70%" stop-color="#092B19"/>
            <stop offset="100%" stop-color="#0E3D24"/>
        </linearGradient>
        <linearGradient id="m_om_rib_stripe" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#0288D1"/>
            <stop offset="50%" stop-color="#4FC3F7"/>
            <stop offset="100%" stop-color="#0288D1"/>
        </linearGradient>
        <linearGradient id="m_om_rib_v" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.25"/>
            <stop offset="20%" stop-color="#FFFFFF" stop-opacity="0.0"/>
            <stop offset="80%" stop-color="#000000" stop-opacity="0.0"/>
            <stop offset="100%" stop-color="#000000" stop-opacity="0.45"/>
        </linearGradient>

        <!-- Clasp / Bar Gradients -->
        <linearGradient id="m_om_clasp" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#E0BA38"/>
            <stop offset="25%" stop-color="#FFFFFF"/>
            <stop offset="50%" stop-color="#E0BA38"/>
            <stop offset="100%" stop-color="#144D29"/>
        </linearGradient>
        <linearGradient id="m_om_ring" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#E0BA38"/>
            <stop offset="40%" stop-color="#FFFFFF"/>
            <stop offset="70%" stop-color="#0A2915"/>
            <stop offset="100%" stop-color="#E0BA38"/>
        </linearGradient>

        <!-- Medallion Rim Gradients -->
        <linearGradient id="m_om_rim" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#FFF0AA"/>
            <stop offset="25%" stop-color="#FFE680"/>
            <stop offset="50%" stop-color="#0A2915"/>
            <stop offset="75%" stop-color="#C9A020"/>
            <stop offset="100%" stop-color="#144D29"/>
        </linearGradient>
        <linearGradient id="m_om_rim_inner" x1="100%" y1="100%" x2="0%" y2="0%">
            <stop offset="0%" stop-color="#FFF0AA"/>
            <stop offset="50%" stop-color="#C9A020"/>
            <stop offset="100%" stop-color="#0A2915"/>
        </linearGradient>

        <!-- Medallion Face Radial Gradient -->
        <radialGradient id="m_om_face" cx="45%" cy="40%" r="65%">
            <stop offset="0%" stop-color="#1E6B3B"/>
            <stop offset="70%" stop-color="#0D331C"/>
            <stop offset="100%" stop-color="#0A0604"/>
        </radialGradient>

        <!-- Gold Relief Gradient for Emblems -->
        <linearGradient id="m_om_gold_relief" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#FFF8D6"/>
            <stop offset="35%" stop-color="#FFDF66"/>
            <stop offset="70%" stop-color="#C2870A"/>
            <stop offset="100%" stop-color="#734F00"/>
        </linearGradient>

        <!-- Silver Relief Gradient -->
        <linearGradient id="m_om_silver_relief" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#FFFFFF"/>
            <stop offset="35%" stop-color="#E1E8F0"/>
            <stop offset="70%" stop-color="#8E9AA6"/>
            <stop offset="100%" stop-color="#4B5560"/>
        </linearGradient>
    </defs>    <!-- Hanging Ribbon -->
    <g filter="url(#m_om_shadow)">
        <polygon points="35,8 85,8 85,55 60,68 35,55" fill="url(#m_om_rib_l)"/>
        <polygon points="50,8 70,8 70,62 60,68 50,62" fill="url(#m_om_rib_stripe)"/>
        <polygon points="35,8 85,8 85,55 60,68 35,55" fill="url(#m_om_rib_v)"/>
        <line x1="37" y1="8" x2="37" y2="56" stroke="#FFD700" stroke-width="1.5" opacity="0.75"/>
        <line x1="83" y1="8" x2="83" y2="56" stroke="#FFD700" stroke-width="1.5" opacity="0.75"/>
    </g>

    <!-- Top Hanger Bar / Clasp -->
    <g filter="url(#m_om_shadow)">
        <rect x="28" y="5" width="64" height="8" rx="2.5" fill="url(#m_om_clasp)" stroke="#3D2505" stroke-width="0.8"/>
        <circle cx="32" cy="9" r="1.5" fill="#FFF" opacity="0.8"/>
        <circle cx="88" cy="9" r="1.5" fill="#FFF" opacity="0.8"/>
    </g>

    <!-- Connecting Suspension Ring -->
    <circle cx="60" cy="65" r="8" fill="none" stroke="url(#m_om_ring)" stroke-width="3" filter="url(#m_om_shadow)"/>

    <!-- Circular Medallion Body -->
    <g filter="url(#m_om_shadow)">
        <circle cx="60" cy="102" r="43" fill="url(#m_om_rim)" stroke="#1F1206" stroke-width="1"/>
        <circle cx="60" cy="102" r="39.5" fill="none" stroke="url(#m_om_rim_inner)" stroke-width="1.5" stroke-dasharray="1.8,1.8"/>
        <circle cx="60" cy="102" r="37" fill="url(#m_om_rim_inner)" stroke="#261608" stroke-width="0.8"/>
        <circle cx="60" cy="102" r="34" fill="url(#m_om_face)"/>
        <g opacity="0.18" stroke="#FFFFFF" stroke-width="0.7">
            <line x1="72" y1="102" x2="93" y2="102"/>
            <line x1="71.1" y1="106.6" x2="90.5" y2="114.6"/>
            <line x1="68.5" y1="110.5" x2="83.3" y2="125.3"/>
            <line x1="64.6" y1="113.1" x2="72.6" y2="132.5"/>
            <line x1="60" y1="114" x2="60" y2="135"/>
            <line x1="55.4" y1="113.1" x2="47.4" y2="132.5"/>
            <line x1="51.5" y1="110.5" x2="36.7" y2="125.3"/>
            <line x1="48.9" y1="106.6" x2="29.5" y2="114.6"/>
            <line x1="48" y1="102" x2="27" y2="102"/>
            <line x1="48.9" y1="97.4" x2="29.5" y2="89.4"/>
            <line x1="51.5" y1="93.5" x2="36.7" y2="78.7"/>
            <line x1="55.4" y1="90.9" x2="47.4" y2="71.5"/>
            <line x1="60" y1="90" x2="60" y2="69"/>
            <line x1="64.6" y1="90.9" x2="72.6" y2="71.5"/>
            <line x1="68.5" y1="93.5" x2="83.3" y2="78.7"/>
            <line x1="71.1" y1="97.4" x2="90.5" y2="89.4"/>
        </g>
        <!-- Laurel Wreath Inner Border -->
        <g opacity="0.4" fill="url(#m_om_gold_relief)">
            <ellipse cx="34" cy="87" rx="2.5" ry="4.5" transform="rotate(-60 34 87)"/>
            <ellipse cx="86" cy="87" rx="2.5" ry="4.5" transform="rotate(60 86 87)"/>
            <ellipse cx="42.4" cy="77.7" rx="2.5" ry="4.5" transform="rotate(-36 42.4 77.7)"/>
            <ellipse cx="77.6" cy="77.7" rx="2.5" ry="4.5" transform="rotate(36 77.6 77.7)"/>
            <ellipse cx="53.8" cy="72.7" rx="2.5" ry="4.5" transform="rotate(-12 53.8 72.7)"/>
            <ellipse cx="66.2" cy="72.7" rx="2.5" ry="4.5" transform="rotate(12 66.2 72.7)"/>
            <ellipse cx="66.2" cy="72.7" rx="2.5" ry="4.5" transform="rotate(12 66.2 72.7)"/>
            <ellipse cx="53.8" cy="72.7" rx="2.5" ry="4.5" transform="rotate(-12 53.8 72.7)"/>
            <ellipse cx="77.6" cy="77.7" rx="2.5" ry="4.5" transform="rotate(36 77.6 77.7)"/>
            <ellipse cx="42.4" cy="77.7" rx="2.5" ry="4.5" transform="rotate(-36 42.4 77.7)"/>
            <ellipse cx="86" cy="87" rx="2.5" ry="4.5" transform="rotate(60 86 87)"/>
            <ellipse cx="34" cy="87" rx="2.5" ry="4.5" transform="rotate(-60 34 87)"/>
        </g>
    </g>

    <!-- Emblem: Oasis Master (Sacred Tree, Water Springs & Sun) -->
    <g filter="url(#m_om_emboss)">
        <!-- Sun Rays -->
        <circle cx="60" cy="85" r="9" fill="#FFF176" opacity="0.8"/>
        <!-- Oasis Water Pond -->
        <ellipse cx="60" cy="112" rx="20" ry="6" fill="#29B6F6" stroke="#0277BD" stroke-width="1"/>
        <ellipse cx="60" cy="112" rx="14" ry="3.5" fill="#B3E5FC" opacity="0.7"/>
        <!-- Majestic Palm / Oak Tree Trunk -->
        <path d="M 57,112 Q 56,98 55,90 Q 60,88 65,90 Q 64,98 63,112 Z" fill="#5D4037" stroke="#3E2723" stroke-width="0.8"/>
        <!-- Lush Foliage Canopy (Three clusters) -->
        <circle cx="60" cy="83" r="10" fill="#2E7D32" stroke="#1B5E20" stroke-width="1"/>
        <circle cx="51" cy="89" r="8" fill="#388E3C" stroke="#1B5E20" stroke-width="0.8"/>
        <circle cx="69" cy="89" r="8" fill="#388E3C" stroke="#1B5E20" stroke-width="0.8"/>
        <!-- Highlights on leaves -->
        <circle cx="58" cy="80" r="4" fill="#81C784" opacity="0.7"/>
        <circle cx="50" cy="86" r="3" fill="#81C784" opacity="0.7"/>
        <circle cx="68" cy="86" r="3" fill="#81C784" opacity="0.7"/>
    </g>    <!-- Tier Stars -->
    <g filter="url(#m_om_shadow)" fill="url(#m_om_gold_relief)" stroke="#4A2E00" stroke-width="0.5">
        <path d="M 49,135 m 0,-5.5 1.6,3.6 3.9,0.4 -2.9,2.6 0.8,3.9 -3.4,-2 -3.4,2 0.8,-3.9 -2.9,-2.6 3.9,-0.4 z"/>
        <path d="M 60,135 m 0,-5.5 1.6,3.6 3.9,0.4 -2.9,2.6 0.8,3.9 -3.4,-2 -3.4,2 0.8,-3.9 -2.9,-2.6 3.9,-0.4 z"/>
        <path d="M 71,135 m 0,-5.5 1.6,3.6 3.9,0.4 -2.9,2.6 0.8,3.9 -3.4,-2 -3.4,2 0.8,-3.9 -2.9,-2.6 3.9,-0.4 z"/>
    </g>
    <!-- Bottom Ribbon Title Scroll -->
    <g filter="url(#m_om_shadow)">
        <path d="M 26,140 Q 60,135 94,140 L 98,148 Q 60,143 22,148 Z" fill="#241407" stroke="#C9A020" stroke-width="0.8"/>
        <text x="60" y="145.5" font-family="'Georgia', 'Times New Roman', serif" font-size="6.5" font-weight="bold" fill="#FFE680" text-anchor="middle" letter-spacing="0.8">OASIS MASTER</text>
    </g></svg>
