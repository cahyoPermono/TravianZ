<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 155" width="120" height="155">
    <defs>
        <!-- Drop Shadow Filters -->
        <filter id="m_h50_shadow" x="-20%" y="-15%" width="140%" height="140%">
            <feDropShadow dx="0" dy="4" stdDeviation="3.5" flood-color="#000000" flood-opacity="0.55"/>
        </filter>
        <filter id="m_h50_emboss" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="0" dy="1.5" stdDeviation="1" flood-color="#FFFFFF" flood-opacity="0.75" result="light"/>
            <feDropShadow dx="0" dy="-1.5" stdDeviation="1" flood-color="#000000" flood-opacity="0.65" result="dark"/>
        </filter>
        <filter id="m_h50_glow" x="-30%" y="-30%" width="160%" height="160%">
            <feGaussianBlur stdDeviation="3" result="blur"/>
            <feComposite in="SourceGraphic" in2="blur" operator="over"/>
        </filter>

        <!-- Ribbon Gradients -->
        <linearGradient id="m_h50_rib_l" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#5D4037"/>
            <stop offset="30%" stop-color="#795548"/>
            <stop offset="70%" stop-color="#3E2723"/>
            <stop offset="100%" stop-color="#5D4037"/>
        </linearGradient>
        <linearGradient id="m_h50_rib_stripe" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#D4AF37"/>
            <stop offset="50%" stop-color="#FFE082"/>
            <stop offset="100%" stop-color="#D4AF37"/>
        </linearGradient>
        <linearGradient id="m_h50_rib_v" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.25"/>
            <stop offset="20%" stop-color="#FFFFFF" stop-opacity="0.0"/>
            <stop offset="80%" stop-color="#000000" stop-opacity="0.0"/>
            <stop offset="100%" stop-color="#000000" stop-opacity="0.45"/>
        </linearGradient>

        <!-- Clasp / Bar Gradients -->
        <linearGradient id="m_h50_clasp" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#C47A38"/>
            <stop offset="25%" stop-color="#FFFFFF"/>
            <stop offset="50%" stop-color="#C47A38"/>
            <stop offset="100%" stop-color="#6A3510"/>
        </linearGradient>
        <linearGradient id="m_h50_ring" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#C47A38"/>
            <stop offset="40%" stop-color="#FFFFFF"/>
            <stop offset="70%" stop-color="#3D1D08"/>
            <stop offset="100%" stop-color="#C47A38"/>
        </linearGradient>

        <!-- Medallion Rim Gradients -->
        <linearGradient id="m_h50_rim" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#E8B078"/>
            <stop offset="25%" stop-color="#D48C46"/>
            <stop offset="50%" stop-color="#3D1D08"/>
            <stop offset="75%" stop-color="#8C532B"/>
            <stop offset="100%" stop-color="#5C3014"/>
        </linearGradient>
        <linearGradient id="m_h50_rim_inner" x1="100%" y1="100%" x2="0%" y2="0%">
            <stop offset="0%" stop-color="#E8B078"/>
            <stop offset="50%" stop-color="#8C532B"/>
            <stop offset="100%" stop-color="#3D1D08"/>
        </linearGradient>

        <!-- Medallion Face Radial Gradient -->
        <radialGradient id="m_h50_face" cx="45%" cy="40%" r="65%">
            <stop offset="0%" stop-color="#A86834"/>
            <stop offset="70%" stop-color="#4A240C"/>
            <stop offset="100%" stop-color="#0A0604"/>
        </radialGradient>

        <!-- Gold Relief Gradient for Emblems -->
        <linearGradient id="m_h50_gold_relief" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#FFF8D6"/>
            <stop offset="35%" stop-color="#FFDF66"/>
            <stop offset="70%" stop-color="#C2870A"/>
            <stop offset="100%" stop-color="#734F00"/>
        </linearGradient>

        <!-- Silver Relief Gradient -->
        <linearGradient id="m_h50_silver_relief" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#FFFFFF"/>
            <stop offset="35%" stop-color="#E1E8F0"/>
            <stop offset="70%" stop-color="#8E9AA6"/>
            <stop offset="100%" stop-color="#4B5560"/>
        </linearGradient>
    </defs>    <!-- Hanging Ribbon -->
    <g filter="url(#m_h50_shadow)">
        <polygon points="35,8 85,8 85,55 60,68 35,55" fill="url(#m_h50_rib_l)"/>
        <polygon points="50,8 70,8 70,62 60,68 50,62" fill="url(#m_h50_rib_stripe)"/>
        <polygon points="35,8 85,8 85,55 60,68 35,55" fill="url(#m_h50_rib_v)"/>
        <line x1="37" y1="8" x2="37" y2="56" stroke="#FFD700" stroke-width="1.5" opacity="0.75"/>
        <line x1="83" y1="8" x2="83" y2="56" stroke="#FFD700" stroke-width="1.5" opacity="0.75"/>
    </g>

    <!-- Top Hanger Bar / Clasp -->
    <g filter="url(#m_h50_shadow)">
        <rect x="28" y="5" width="64" height="8" rx="2.5" fill="url(#m_h50_clasp)" stroke="#3D2505" stroke-width="0.8"/>
        <circle cx="32" cy="9" r="1.5" fill="#FFF" opacity="0.8"/>
        <circle cx="88" cy="9" r="1.5" fill="#FFF" opacity="0.8"/>
    </g>

    <!-- Connecting Suspension Ring -->
    <circle cx="60" cy="65" r="8" fill="none" stroke="url(#m_h50_ring)" stroke-width="3" filter="url(#m_h50_shadow)"/>

    <!-- Circular Medallion Body -->
    <g filter="url(#m_h50_shadow)">
        <circle cx="60" cy="102" r="43" fill="url(#m_h50_rim)" stroke="#1F1206" stroke-width="1"/>
        <circle cx="60" cy="102" r="39.5" fill="none" stroke="url(#m_h50_rim_inner)" stroke-width="1.5" stroke-dasharray="1.8,1.8"/>
        <circle cx="60" cy="102" r="37" fill="url(#m_h50_rim_inner)" stroke="#261608" stroke-width="0.8"/>
        <circle cx="60" cy="102" r="34" fill="url(#m_h50_face)"/>
        <g opacity="0.18" stroke="#FFFFFF" stroke-width="0.7">
            <line x1="72" y1="102" x2="93" y2="102"/>
            <line x1="71.1" y1="106.6" x2="90.5" y2="114.6"/>
            <line x1="68.5" y1="110.5" x2="83.3" y2="125.3"/>
            <line x1="64.6" y1="113.1" x2="72.6" y2="132.5"/>
            <line x1="60" y1="114" x2="60" y2="135"/>
            <line x1="55.4" y1="113.1" x2="47.4" y2="132.5"/>
            <line x1="51.5" y1="110.5" x2="36.7" y2="125.3"/>
            <line x1="48.9" y1="106.6" x2="29.5" y2="114.6"/>
            <line x1="48" y1="102" x2="27" y2="102"/>
            <line x1="48.9" y1="97.4" x2="29.5" y2="89.4"/>
            <line x1="51.5" y1="93.5" x2="36.7" y2="78.7"/>
            <line x1="55.4" y1="90.9" x2="47.4" y2="71.5"/>
            <line x1="60" y1="90" x2="60" y2="69"/>
            <line x1="64.6" y1="90.9" x2="72.6" y2="71.5"/>
            <line x1="68.5" y1="93.5" x2="83.3" y2="78.7"/>
            <line x1="71.1" y1="97.4" x2="90.5" y2="89.4"/>
        </g>
        <!-- Laurel Wreath Inner Border -->
        <g opacity="0.4" fill="url(#m_h50_gold_relief)">
            <ellipse cx="34" cy="87" rx="2.5" ry="4.5" transform="rotate(-60 34 87)"/>
            <ellipse cx="86" cy="87" rx="2.5" ry="4.5" transform="rotate(60 86 87)"/>
            <ellipse cx="42.4" cy="77.7" rx="2.5" ry="4.5" transform="rotate(-36 42.4 77.7)"/>
            <ellipse cx="77.6" cy="77.7" rx="2.5" ry="4.5" transform="rotate(36 77.6 77.7)"/>
            <ellipse cx="53.8" cy="72.7" rx="2.5" ry="4.5" transform="rotate(-12 53.8 72.7)"/>
            <ellipse cx="66.2" cy="72.7" rx="2.5" ry="4.5" transform="rotate(12 66.2 72.7)"/>
            <ellipse cx="66.2" cy="72.7" rx="2.5" ry="4.5" transform="rotate(12 66.2 72.7)"/>
            <ellipse cx="53.8" cy="72.7" rx="2.5" ry="4.5" transform="rotate(-12 53.8 72.7)"/>
            <ellipse cx="77.6" cy="77.7" rx="2.5" ry="4.5" transform="rotate(36 77.6 77.7)"/>
            <ellipse cx="42.4" cy="77.7" rx="2.5" ry="4.5" transform="rotate(-36 42.4 77.7)"/>
            <ellipse cx="86" cy="87" rx="2.5" ry="4.5" transform="rotate(60 86 87)"/>
            <ellipse cx="34" cy="87" rx="2.5" ry="4.5" transform="rotate(-60 34 87)"/>
        </g>
    </g>

    <!-- Emblem: Hero Veteran (Winged Helmet & Roman 'L') -->
    <g filter="url(#m_h50_emboss)">
        <!-- Golden Laurel Wreath -->
        <circle cx="60" cy="99" r="18" fill="none" stroke="url(#m_h50_gold_relief)" stroke-width="2.5" stroke-dasharray="3.5,1.5"/>
        <!-- Angelic / Hermes Wings flanking helmet -->
        <path d="M 44,95 C 34,85 36,75 48,82 C 45,88 46,92 48,96 Z" fill="url(#m_h50_silver_relief)" stroke="#37474F" stroke-width="0.8"/>
        <path d="M 76,95 C 86,85 84,75 72,82 C 75,88 74,92 72,96 Z" fill="url(#m_h50_silver_relief)" stroke="#37474F" stroke-width="0.8"/>
        <!-- Polished Steel Helmet Dome -->
        <path d="M 50,86 C 48,80 72,80 70,86 C 73,98 71,106 67,110 L 65,113 L 55,113 L 53,110 C 49,106 47,98 50,86 Z" fill="url(#m_h50_silver_relief)" stroke="#263238" stroke-width="1"/>
        <!-- Golden Brow Band with Ruby -->
        <rect x="49" y="92" width="22" height="3" fill="url(#m_h50_gold_relief)"/>
        <circle cx="60" cy="93.5" r="2" fill="#D32F2F" stroke="#FFF" stroke-width="0.5"/>
        <!-- Roman Numeral 'L' (50) engraved on visor -->
        <text x="60" y="106" font-family="'Georgia', serif" font-size="10" font-weight="bold" fill="url(#m_h50_gold_relief)" stroke="#4E342E" stroke-width="0.6" text-anchor="middle">L</text>
    </g>    <!-- Tier Stars -->
    <g filter="url(#m_h50_shadow)" fill="url(#m_h50_gold_relief)" stroke="#4A2E00" stroke-width="0.5">
        <path d="M 54.5,135 m 0,-5.5 1.6,3.6 3.9,0.4 -2.9,2.6 0.8,3.9 -3.4,-2 -3.4,2 0.8,-3.9 -2.9,-2.6 3.9,-0.4 z"/>
        <path d="M 65.5,135 m 0,-5.5 1.6,3.6 3.9,0.4 -2.9,2.6 0.8,3.9 -3.4,-2 -3.4,2 0.8,-3.9 -2.9,-2.6 3.9,-0.4 z"/>
    </g>
    <!-- Bottom Ribbon Title Scroll -->
    <g filter="url(#m_h50_shadow)">
        <path d="M 26,140 Q 60,135 94,140 L 98,148 Q 60,143 22,148 Z" fill="#241407" stroke="#C9A020" stroke-width="0.8"/>
        <text x="60" y="145.5" font-family="'Georgia', 'Times New Roman', serif" font-size="6.5" font-weight="bold" fill="#FFE680" text-anchor="middle" letter-spacing="0.8">VETERAN Lvl 50</text>
    </g></svg>
